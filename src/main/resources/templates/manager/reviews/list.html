<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đánh giá - Manager</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #334155;
        min-height: 100vh;
    }

    .container {
        width: 94%;
        max-width: 1250px;
        margin: 40px auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 30px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(79, 70, 229, 0.2);
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 29px;
        margin-bottom: 7px;
    }

    .header p {
        color: #e0e7ff;
        font-size: 14px;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        margin-bottom: 20px;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 17px;
        background: white;
        color: #4f46e5;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .back-btn:hover {
        background: #4f46e5;
        color: white;
    }

    /* =========================
       ALERT
    ========================= */

    .alert-success {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
        padding: 13px 17px;
        border-radius: 9px;
        margin-bottom: 18px;
        font-size: 14px;
        font-weight: 500;
    }

    /* =========================
       TABLE CARD
    ========================= */

    .table-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
    }

    .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .table-header h2 {
        font-size: 20px;
        color: #1e293b;
    }

    .review-count {
        color: #64748b;
        font-size: 13px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 1000px;
        border-collapse: collapse;
    }

    thead {
        background: #f8fafc;
    }

    th {
        text-align: left;
        padding: 14px 15px;
        color: #64748b;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
        vertical-align: middle;
    }

    tbody tr {
        transition: 0.2s;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    /* =========================
       ID
    ========================= */

    .review-id {
        color: #4f46e5;
        font-weight: 700;
    }

    /* =========================
       PRODUCT
    ========================= */

    .product-name {
        color: #1e293b;
        font-weight: 600;
        max-width: 220px;
    }

    /* =========================
       USER
    ========================= */

    .user-email {
        color: #64748b;
        font-size: 13px;
    }

    /* =========================
       RATING
    ========================= */

    .rating {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        background: #fffbeb;
        color: #d97706;
        border-radius: 20px;
        font-weight: 700;
        white-space: nowrap;
    }

    .stars {
        color: #f59e0b;
        font-size: 15px;
        letter-spacing: 1px;
    }

    .rating-number {
        color: #92400e;
        font-size: 12px;
    }

    /* =========================
       CONTENT
    ========================= */

    .review-content {
        max-width: 350px;
        color: #475569;
        line-height: 1.6;
        word-break: break-word;
    }

    /* =========================
       DATE
    ========================= */

    .review-date {
        color: #64748b;
        white-space: nowrap;
        font-size: 13px;
    }

    /* =========================
       DELETE
    ========================= */

    .delete-btn {
        padding: 8px 13px;
        border: none;
        border-radius: 7px;
        background: #fef2f2;
        color: #dc2626;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
    }

    .delete-btn:hover {
        background: #dc2626;
        color: white;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        text-align: center;
        padding: 50px !important;
        color: #94a3b8;
        font-style: italic;
    }

    .empty-icon {
        display: block;
        font-size: 35px;
        margin-bottom: 10px;
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 25px;
    }

    .page-link {
        width: 36px;
        height: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        background: white;
        color: #64748b;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .page-link:hover {
        background: #eef2ff;
        color: #4f46e5;
        border-color: #c7d2fe;
    }

    .page-link.active {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 768px) {

        .container {
            width: 94%;
            margin: 20px auto;
        }

        .header {
            padding: 23px;
        }

        .header h1 {
            font-size: 24px;
        }

        .table-card {
            padding: 18px;
        }

        .table-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 7px;
        }
    }
  </style>

</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">

    <h1>⭐ Quản lý Đánh giá</h1>

    <p>
      Theo dõi và quản lý đánh giá của khách hàng về sản phẩm
    </p>

  </div>

  <!-- Navigation -->
  <div class="navigation">

    <a href="/manager/dashboard"
       class="back-btn">
      ← Dashboard
    </a>

  </div>

  <!-- Success -->
  <div th:if="${success}"
       class="alert-success"
       th:text="${success}">
  </div>

  <!-- Reviews -->
  <div class="table-card">

    <div class="table-header">

      <h2>
        💬 Danh sách đánh giá
      </h2>

      <span class="review-count"
            th:text="'Tổng: ' + ${reviews.totalElements} + ' đánh giá'">
            Tổng đánh giá
        </span>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>

        <tr>
          <th>ID</th>
          <th>Sản phẩm</th>
          <th>Người dùng</th>
          <th>Rating</th>
          <th>Nội dung</th>
          <th>Ngày</th>
          <th>Xóa</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="r : ${reviews.content}">

          <!-- ID -->
          <td class="review-id"
              th:text="${r.id}">
          </td>

          <!-- Product -->
          <td>

            <div class="product-name"
                 th:text="${r.product?.name != null ? r.product.name : 'Sản phẩm không tồn tại'}">
            </div>

          </td>

          <!-- User -->
          <td>

                    <span class="user-email"
                          th:text="${r.user?.email != null ? r.user.email : 'Người dùng không tồn tại'}">
                    </span>

          </td>

          <!-- Rating -->
          <td>

            <div class="rating">

                        <span class="stars">
                            ★
                        </span>

              <span class="rating-number"
                    th:text="${r.rating + ' / 5'}">
                            5 / 5
                        </span>

            </div>

          </td>

          <!-- Content -->
          <td>

            <div class="review-content"
                 th:text="${r.comment != null and !#strings.isEmpty(r.comment) ? r.comment : 'Không có nội dung'}">
            </div>

          </td>

          <!-- Date -->
          <td>

                    <span class="review-date"
                          th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy')}">
                    </span>

          </td>

          <!-- Delete -->
          <td>

            <form th:action="@{/manager/reviews/{id}/delete(id=${r.id})}"
                  method="post"
                  onsubmit="return confirm('Bạn có chắc muốn xóa đánh giá này?')">

              <button type="submit"
                      class="delete-btn">
                🗑 Xóa
              </button>

            </form>

          </td>

        </tr>

        <!-- Empty -->
        <tr th:if="${reviews.empty}">

          <td colspan="7"
              class="empty">

                    <span class="empty-icon">
                        💬
                    </span>

            Chưa có đánh giá nào.

          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <!-- Pagination -->
    <div class="pagination"
         th:if="${reviews.totalPages > 1}">

        <span th:each="i : ${#numbers.sequence(0, reviews.totalPages - 1)}">

            <a th:href="@{/manager/reviews(page=${i})}"
               class="page-link"
               th:classappend="${i == reviews.number} ? 'active' : ''"
               th:text="${i + 1}">
                1
            </a>

        </span>

    </div>

  </div>

</div> </body> </html>
