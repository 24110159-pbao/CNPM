<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Danh mục - Manager</title>
  <style>

    /* =====================================================
       GLOBAL
    ===================================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #eef7ff;
        color: #334155;
        min-height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
        position: relative;
        overflow: hidden;

        background: linear-gradient(
            135deg,
            #0084ff 0%,
            #0066d6 50%,
            #004fa8 100%
        );

        color: white;

        padding: 28px 35px;

        border-radius: 14px;

        box-shadow:
            0 8px 25px rgba(0, 91, 187, 0.18);

        margin-bottom: 25px;
    }

    .header::after {
        content: "";

        position: absolute;

        width: 220px;
        height: 220px;

        right: -80px;
        top: -100px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.09);
    }

    .header h1 {
        font-size: 30px;

        margin-bottom: 8px;

        position: relative;

        z-index: 2;
    }

    .header p {
        color: #e8f5ff;

        font-size: 15px;

        position: relative;

        z-index: 2;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .navigation {
        margin-bottom: 25px;
    }

    .dashboard-btn {
        display: inline-block;

        text-decoration: none;

        background: white;

        color: #0066d6;

        padding: 10px 18px;

        border-radius: 8px;

        font-weight: 600;

        border: 1px solid #cfe8ff;

        transition: all 0.2s ease;
    }

    .dashboard-btn:hover {
        background: #0874e9;

        color: white;

        border-color: #0874e9;

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(0, 86, 179, 0.18);
    }


    /* =====================================================
       ALERT
    ===================================================== */

    .alert {
        padding: 14px 18px;

        border-radius: 10px;

        margin-bottom: 20px;

        font-size: 14px;

        font-weight: 500;
    }

    .alert-success {
        background: #ecfdf5;

        color: #047857;

        border: 1px solid #a7f3d0;
    }

    .alert-error {
        background: #fef2f2;

        color: #dc2626;

        border: 1px solid #fecaca;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {
        background: white;

        border-radius: 12px;

        padding: 25px;

        margin-bottom: 25px;

        box-shadow:
            0 5px 20px rgba(0, 86, 179, 0.06);

        border: 1px solid #dceeff;
    }

    .card h2 {
        font-size: 20px;

        margin-bottom: 18px;

        color: #0056b3;
    }


    /* =====================================================
       CREATE FORM
    ===================================================== */

    .create-form {
        display: flex;

        gap: 12px;
    }

    .create-form input {
        flex: 1;
    }


    /* =====================================================
       INPUT
    ===================================================== */

    input[type="text"] {
        width: 100%;

        padding: 11px 14px;

        border: 1px solid #cbddec;

        border-radius: 8px;

        outline: none;

        font-size: 14px;

        color: #374151;

        transition: all 0.2s ease;

        background: #fff;
    }

    input[type="text"]:focus {
        border-color: #0874e9;

        box-shadow:
            0 0 0 3px rgba(8, 116, 233, 0.12);
    }

    input[type="text"]::placeholder {
        color: #9ca3af;
    }


    /* =====================================================
       BUTTON
    ===================================================== */

    button {
        border: none;

        border-radius: 8px;

        padding: 10px 17px;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition: all 0.2s ease;
    }


    /* ADD */

    .btn-add {
        background: #0874e9;

        color: white;

        min-width: 80px;
    }

    .btn-add:hover {
        background: #0056c9;

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(0, 86, 179, 0.16);
    }


    /* SAVE */

    .btn-save {
        background: #10b981;

        color: white;
    }

    .btn-save:hover {
        background: #059669;

        transform: translateY(-1px);
    }


    /* DELETE */

    .btn-delete {
        background: #ef4444;

        color: white;
    }

    .btn-delete:hover {
        background: #dc2626;

        transform: translateY(-1px);
    }


    /* =====================================================
       TABLE
    ===================================================== */

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;

        border-collapse: collapse;

        border: none;
    }

    thead {
        background: #eef7ff;
    }

    th {
        text-align: left;

        padding: 14px 16px;

        color: #0056b3;

        font-size: 13px;

        text-transform: uppercase;

        letter-spacing: 0.5px;

        border-bottom: 1px solid #cfe8ff;
    }

    td {
        padding: 14px 16px;

        border-bottom: 1px solid #edf4fa;

        vertical-align: middle;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f5faff;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }


    /* =====================================================
       ID
    ===================================================== */

    .id {
        color: #0874e9;

        font-weight: 700;

        width: 80px;
    }


    /* =====================================================
       EDIT FORM
    ===================================================== */

    .edit-form {
        display: flex;

        align-items: center;

        gap: 10px;
    }

    .edit-form input {
        max-width: 350px;
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
        text-align: center;

        color: #94a3b8;

        padding: 30px !important;

        font-style: italic;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 768px) {

        .container {
            width: 94%;

            margin: 20px auto;
        }

        .header {
            padding: 22px;
        }

        .header h1 {
            font-size: 24px;
        }

        .create-form {
            flex-direction: column;
        }

        .create-form button {
            width: 100%;
        }

        .edit-form {
            flex-direction: column;

            align-items: stretch;
        }

        .edit-form input {
            max-width: none;
        }

        .edit-form button {
            width: 100%;
        }

        td,
        th {
            padding: 12px 10px;
        }

    }

  </style>

</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Quản lý Danh mục</h1>
    <p>Quản lý và cập nhật danh mục sản phẩm của hệ thống</p>
  </div>

  <!-- Navigation -->
  <div class="navigation">
    <a href="/manager/dashboard" class="dashboard-btn">
      ← Quay lại Dashboard
    </a>
  </div>

  <!-- Messages -->
  <div th:if="${success}"
       class="alert alert-success"
       th:text="${success}">
  </div>

  <div th:if="${error}"
       class="alert alert-error"
       th:text="${error}">
  </div>

  <!-- Add category -->
  <div class="card">
    <h2>➕ Thêm danh mục mới</h2>

    <form action="/manager/categories/create"
          method="post"
          class="create-form">

      <input type="text"
             name="name"
             placeholder="Nhập tên danh mục..."
             required>

      <button type="submit" class="btn-add">
        Thêm
      </button>
    </form>
  </div>

  <!-- Category list -->
  <div class="card">
    <h2>📁 Danh sách danh mục</h2>

    <div class="table-wrapper">
      <table>

        <thead>
        <tr>
          <th>ID</th>
          <th>Tên danh mục</th>
          <th>Hành động</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="c : ${categories}">

          <td class="id"
              th:text="${c.id}">
          </td>

          <td>
            <form th:action="@{/manager/categories/{id}/edit(id=${c.id})}"
                  method="post"
                  class="edit-form">

              <input type="text"
                     name="name"
                     th:value="${c.name}"
                     required>

              <button type="submit"
                      class="btn-save">
                Lưu
              </button>

            </form>
          </td>

          <td>
            <form th:action="@{/manager/categories/{id}/delete(id=${c.id})}"
                  method="post"
                  onsubmit="return confirm('Xóa danh mục này?')">

              <button type="submit"
                      class="btn-delete">
                Xóa
              </button>

            </form>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="3" class="empty">
            Chưa có danh mục nào.
          </td>
        </tr>

        </tbody>

      </table>
    </div>
  </div>

</div> </body> </html>
