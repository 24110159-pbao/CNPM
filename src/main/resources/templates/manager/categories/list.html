<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Danh mục - Manager</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #333;
        min-height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: white;
        padding: 28px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(79, 70, 229, 0.2);
        margin-bottom: 25px;
    }

    .header h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .header p {
        color: #e0e7ff;
        font-size: 15px;
    }

    /* Navigation */
    .navigation {
        margin-bottom: 25px;
    }

    .dashboard-btn {
        display: inline-block;
        text-decoration: none;
        background: white;
        color: #4f46e5;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;
        border: 1px solid #e5e7eb;
        transition: all 0.2s ease;
    }

    .dashboard-btn:hover {
        background: #4f46e5;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(79, 70, 229, 0.2);
    }

    /* Alert */
    .alert {
        padding: 14px 18px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
    }

    .alert-success {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
    }

    .alert-error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }

    /* Card */
    .card {
        background: white;
        border-radius: 16px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        border: 1px solid #e5e7eb;
    }

    .card h2 {
        font-size: 20px;
        margin-bottom: 18px;
        color: #1f2937;
    }

    /* Create form */
    .create-form {
        display: flex;
        gap: 12px;
    }

    .create-form input {
        flex: 1;
    }

    input[type="text"] {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        color: #374151;
        transition: all 0.2s ease;
        background: #fff;
    }

    input[type="text"]:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    input[type="text"]::placeholder {
        color: #9ca3af;
    }

    /* Buttons */
    button {
        border: none;
        border-radius: 8px;
        padding: 10px 17px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-add {
        background: #4f46e5;
        color: white;
        min-width: 80px;
    }

    .btn-add:hover {
        background: #4338ca;
        transform: translateY(-1px);
    }

    .btn-save {
        background: #10b981;
        color: white;
    }

    .btn-save:hover {
        background: #059669;
    }

    .btn-delete {
        background: #ef4444;
        color: white;
    }

    .btn-delete:hover {
        background: #dc2626;
    }

    /* Table */
    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        border: none;
    }

    thead {
        background: #f8fafc;
    }

    th {
        text-align: left;
        padding: 14px 16px;
        color: #64748b;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #e5e7eb;
    }

    td {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .id {
        color: #6366f1;
        font-weight: 700;
        width: 80px;
    }

    .edit-form {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .edit-form input {
        max-width: 350px;
    }

    .empty {
        text-align: center;
        color: #94a3b8;
        padding: 30px !important;
        font-style: italic;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .container {
            width: 94%;
            margin: 20px auto;
        }

        .header {
            padding: 22px;
        }

        .header h1 {
            font-size: 24px;
        }

        .create-form {
            flex-direction: column;
        }

        .create-form button {
            width: 100%;
        }

        .edit-form {
            flex-direction: column;
            align-items: stretch;
        }

        .edit-form input {
            max-width: none;
        }

        .edit-form button {
            width: 100%;
        }

        td,
        th {
            padding: 12px 10px;
        }
    }
  </style>

</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Quản lý Danh mục</h1>
    <p>Quản lý và cập nhật danh mục sản phẩm của hệ thống</p>
  </div>

  <!-- Navigation -->
  <div class="navigation">
    <a href="/manager/dashboard" class="dashboard-btn">
      ← Quay lại Dashboard
    </a>
  </div>

  <!-- Messages -->
  <div th:if="${success}"
       class="alert alert-success"
       th:text="${success}">
  </div>

  <div th:if="${error}"
       class="alert alert-error"
       th:text="${error}">
  </div>

  <!-- Add category -->
  <div class="card">
    <h2>➕ Thêm danh mục mới</h2>

    <form action="/manager/categories/create"
          method="post"
          class="create-form">

      <input type="text"
             name="name"
             placeholder="Nhập tên danh mục..."
             required>

      <button type="submit" class="btn-add">
        Thêm
      </button>
    </form>
  </div>

  <!-- Category list -->
  <div class="card">
    <h2>📁 Danh sách danh mục</h2>

    <div class="table-wrapper">
      <table>

        <thead>
        <tr>
          <th>ID</th>
          <th>Tên danh mục</th>
          <th>Hành động</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="c : ${categories}">

          <td class="id"
              th:text="${c.id}">
          </td>

          <td>
            <form th:action="@{/manager/categories/{id}/edit(id=${c.id})}"
                  method="post"
                  class="edit-form">

              <input type="text"
                     name="name"
                     th:value="${c.name}"
                     required>

              <button type="submit"
                      class="btn-save">
                Lưu
              </button>

            </form>
          </td>

          <td>
            <form th:action="@{/manager/categories/{id}/delete(id=${c.id})}"
                  method="post"
                  onsubmit="return confirm('Xóa danh mục này?')">

              <button type="submit"
                      class="btn-delete">
                Xóa
              </button>

            </form>
          </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="3" class="empty">
            Chưa có danh mục nào.
          </td>
        </tr>

        </tbody>

      </table>
    </div>
  </div>

</div> </body> </html>
