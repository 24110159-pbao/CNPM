<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết người dùng - Manager</title>

  <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;

        background: #eef7ff;

        color: #334155;

        min-height: 100vh;
    }

    .container {
        width: 94%;

        max-width: 1200px;

        margin: 40px auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: linear-gradient(
            135deg,
            #0084ff 0%,
            #0066d6 50%,
            #004fa8 100%
        );

        color: white;

        padding: 28px 35px;

        border-radius: 16px;

        box-shadow:
            0 8px 25px rgba(0, 91, 187, 0.18);

        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 29px;

        font-weight: 700;

        margin-bottom: 7px;

        line-height: 1.4;
    }

    .header p {
        color: #e8f5ff;

        font-size: 14px;

        line-height: 1.5;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        display: flex;

        gap: 10px;

        margin-bottom: 20px;

        flex-wrap: wrap;
    }

    .back-btn {
        display: inline-flex;

        align-items: center;

        padding: 10px 17px;

        background: white;

        color: #0056b3;

        border: 1px solid #dceeff;

        border-radius: 8px;

        text-decoration: none;

        font-size: 14px;

        font-weight: 600;

        transition: all 0.2s ease;
    }

    .back-btn:hover {
        background: #0874e9;

        color: white;

        border-color: #0874e9;

        transform: translateY(-1px);

        box-shadow:
            0 4px 10px rgba(0, 86, 179, 0.12);
    }

    /* =========================
       ALERT
    ========================= */

    .alert {
        padding: 13px 17px;

        border-radius: 9px;

        margin-bottom: 18px;

        font-size: 14px;

        font-weight: 500;
    }

    .success {
        color: #047857;

        background: #ecfdf5;

        border: 1px solid #a7f3d0;
    }

    .error {
        color: #dc2626;

        background: #fef2f2;

        border: 1px solid #fecaca;
    }

    /* =========================
       TOP GRID
    ========================= */

    .top-grid {
        display: grid;

        grid-template-columns: 1.3fr 0.7fr;

        gap: 20px;

        margin-bottom: 20px;
    }

    /* =========================
       CARD
    ========================= */

    .card,
    .orders-card {
        background: white;

        border: 1px solid #dceeff;

        border-radius: 16px;

        padding: 25px;

        box-shadow:
            0 5px 20px rgba(0, 86, 179, 0.06);
    }

    .card-title {
        display: flex;

        align-items: center;

        color: #0056b3;

        font-size: 19px;

        font-weight: 700;

        padding-bottom: 15px;

        margin-bottom: 5px;

        border-bottom: 1px solid #eaf3fb;
    }

    /* =========================
       USER INFORMATION
    ========================= */

    .info-list {
        display: flex;

        flex-direction: column;
    }

    .info-row {
        display: grid;

        grid-template-columns: 150px 1fr;

        gap: 15px;

        padding: 14px 0;

        border-bottom: 1px solid #edf5fb;
    }

    .info-row:last-child {
        border-bottom: none;
    }

    .info-label {
        color: #64748b;

        font-size: 13px;

        font-weight: 600;
    }

    .info-value {
        color: #1e293b;

        font-size: 14px;

        font-weight: 500;

        word-break: break-word;
    }

    .email {
        color: #0874e9;

        font-weight: 600;
    }

    /* =========================
       ROLE BADGE
    ========================= */

    .role-badge {
        display: inline-flex;

        align-items: center;

        padding: 6px 12px;

        background: #eaf6ff;

        color: #0874e9;

        border: 1px solid #b7dcff;

        border-radius: 20px;

        font-size: 12px;

        font-weight: 700;
    }

    /* =========================
       ROLE FORM
    ========================= */

    .role-form {
        display: flex;

        flex-direction: column;

        gap: 13px;

        padding-top: 15px;
    }

    .role-form label {
        color: #475569;

        font-size: 13px;

        font-weight: 600;
    }

    .role-form select {
        width: 100%;

        height: 42px;

        padding: 0 13px;

        border: 1px solid #cbd5e1;

        border-radius: 8px;

        background: white;

        color: #334155;

        font-family: inherit;

        font-size: 14px;

        outline: none;

        cursor: pointer;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .role-form select:hover {
        border-color: #8cc8ff;
    }

    .role-form select:focus {
        border-color: #0874e9;

        box-shadow:
            0 0 0 3px rgba(8, 116, 233, 0.12);
    }

    .update-btn {
        width: 100%;

        height: 42px;

        padding: 0 18px;

        border: none;

        border-radius: 8px;

        background: linear-gradient(
            135deg,
            #0874e9,
            #0066d6
        );

        color: white;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    .update-btn:hover {
        background: linear-gradient(
            135deg,
            #0056c9,
            #0056b3
        );

        transform: translateY(-1px);

        box-shadow:
            0 5px 15px rgba(0, 86, 179, 0.25);
    }

    .update-btn:active {
        transform: translateY(0);
    }

    /* =========================
       ORDERS
    ========================= */

    .orders-card {
        width: 100%;
    }

    .orders-card .card-title {
        margin-bottom: 20px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
        width: 100%;

        overflow-x: auto;
    }

    table {
        width: 100%;

        min-width: 700px;

        border-collapse: collapse;
    }

    thead {
        background: #f5faff;
    }

    th {
        text-align: left;

        padding: 14px 15px;

        color: #64748b;

        font-size: 12px;

        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 0.4px;

        border-bottom: 1px solid #dceeff;

        white-space: nowrap;
    }

    td {
        padding: 15px;

        border-bottom: 1px solid #edf5fb;

        color: #475569;

        font-size: 14px;

        vertical-align: middle;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f5faff;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    /* =========================
       ORDER ID
    ========================= */

    .order-id {
        color: #0874e9;

        font-weight: 700;

        white-space: nowrap;
    }

    /* =========================
       AMOUNT
    ========================= */

    .amount {
        color: #dc2626;

        font-weight: 700;

        white-space: nowrap;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
        display: inline-flex;

        align-items: center;

        padding: 6px 10px;

        background: #eaf6ff;

        color: #0874e9;

        border: 1px solid #b7dcff;

        border-radius: 20px;

        font-size: 11px;

        font-weight: 700;

        white-space: nowrap;
    }

    /* =========================
       VIEW BUTTON
    ========================= */

    .view-btn {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        padding: 7px 12px;

        background: #eaf6ff;

        color: #0874e9;

        border: 1px solid transparent;

        border-radius: 7px;

        text-decoration: none;

        font-size: 12px;

        font-weight: 600;

        transition: all 0.2s ease;

        white-space: nowrap;
    }

    .view-btn:hover {
        background: #0874e9;

        color: white;

        transform: translateY(-1px);

        box-shadow:
            0 4px 10px rgba(0, 86, 179, 0.12);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        text-align: center;

        padding: 45px !important;

        color: #94a3b8;

        font-style: italic;
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
        display: flex;

        justify-content: center;

        align-items: center;

        gap: 7px;

        margin-top: 25px;
    }

    .pagination > span {
        display: inline-flex;
    }

    .page-link {
        width: 36px;

        height: 36px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: white;

        color: #64748b;

        border: 1px solid #dceeff;

        border-radius: 7px;

        text-decoration: none;

        font-size: 14px;

        font-weight: 600;

        transition: all 0.2s ease;
    }

    .page-link:hover {
        background: #eaf6ff;

        color: #0874e9;

        border-color: #b7dcff;

        transform: translateY(-1px);
    }

    .page-link.active {
        background: #0874e9;

        color: white;

        border-color: #0874e9;

        box-shadow:
            0 3px 8px rgba(8, 116, 233, 0.20);
    }

    /* =========================
       RESPONSIVE - TABLET
    ========================= */

    @media (max-width: 900px) {

        .container {
            width: 94%;

            margin: 25px auto;
        }

        .top-grid {
            grid-template-columns: 1fr;
        }

        .header {
            padding: 24px;
        }

        .header h1 {
            font-size: 25px;
        }
    }

    /* =========================
       RESPONSIVE - MOBILE
    ========================= */

    @media (max-width: 600px) {

        .container {
            width: 94%;

            margin: 20px auto;
        }

        .header {
            padding: 22px;

            border-radius: 14px;
        }

        .header h1 {
            font-size: 22px;

            line-height: 1.5;
        }

        .header p {
            font-size: 13px;
        }

        .card,
        .orders-card {
            padding: 18px;

            border-radius: 14px;
        }

        .card-title {
            font-size: 18px;
        }

        .info-row {
            grid-template-columns: 1fr;

            gap: 5px;

            padding: 12px 0;
        }

        .info-label {
            font-size: 12px;
        }

        .info-value {
            font-size: 14px;
        }

        .back-btn {
            width: 100%;

            justify-content: center;
        }

        .update-btn {
            width: 100%;
        }
    }

    /* =========================
       RESPONSIVE - SMALL MOBILE
    ========================= */

    @media (max-width: 400px) {

        .container {
            width: 96%;

            margin: 15px auto;
        }

        .header {
            padding: 18px;
        }

        .header h1 {
            font-size: 20px;
        }

        .card,
        .orders-card {
            padding: 15px;
        }

        .empty {
            padding: 35px 15px !important;
        }
    }

  </style>

</head> <body> <div class="container">
  <div class="header">

    <h1>
      👤 Chi tiết Người dùng:
      <span th:text="${user.email}"></span>
    </h1>

    <p>
      Xem thông tin và quản lý tài khoản người dùng
    </p>

  </div>

  <div class="navigation">

    <a href="/manager/users"
       class="back-btn">
      ← Danh sách người dùng
    </a>

  </div>

  <div th:if="${success}"
       class="alert success"
       th:text="${success}">
  </div>

  <div th:if="${error}"
       class="alert error"
       th:text="${error}">
  </div>

  <div class="top-grid">

    <!-- User information -->
    <div class="card">

      <div class="card-title">
        👤 Thông tin tài khoản
      </div>

      <div class="info-list">

        <div class="info-row">

          <div class="info-label">
            ID
          </div>

          <div class="info-value"
               th:text="${user.id}">
          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Email
          </div>

          <div class="info-value email"
               th:text="${user.email}">
          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Họ tên
          </div>

          <div class="info-value"
               th:text="${user.name}">
          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Số điện thoại
          </div>

          <div class="info-value"
               th:text="${user.phone}">
          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Địa chỉ
          </div>

          <div class="info-value"
               th:text="${user.address}">
          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Vai trò
          </div>

          <div class="info-value">

                    <span class="role-badge"
                          th:text="${user.role}">
                    </span>

          </div>

        </div>

        <div class="info-row">

          <div class="info-label">
            Ngày đăng ký
          </div>

          <div class="info-value"
               th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">
          </div>

        </div>

      </div>

    </div>

    <!-- Change role -->
    <div class="card">

      <div class="card-title">
        🔐 Đổi vai trò
      </div>

      <form th:action="@{/manager/users/{id}/role(id=${user.id})}"
            method="post"
            class="role-form">

        <label for="role">
          Vai trò tài khoản
        </label>

        <select name="role"
                id="role">

          <option value="USER"
                  th:selected="${user.role.name() == 'USER'}">
            USER
          </option>

          <option value="MANAGER"
                  th:selected="${user.role.name() == 'MANAGER'}">
            MANAGER
          </option>

        </select>

        <button type="submit"
                class="update-btn">
          Cập nhật vai trò
        </button>

      </form>

    </div>

  </div>

  <!-- Order history -->
  <div class="orders-card">

    <div class="card-title">
      🛒 Lịch sử đơn hàng
    </div>

    <div class="table-wrapper">

      <table>

        <thead>

        <tr>
          <th>ID</th>
          <th>Tổng tiền</th>
          <th>Trạng thái</th>
          <th>Ngày đặt</th>
          <th>Chi tiết</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="o : ${orders.content}">

          <td class="order-id"
              th:text="'#' + ${o.id}">
          </td>

          <td class="amount"
              th:text="${o.finalAmount}">
          </td>

          <td>

                    <span class="status"
                          th:text="${o.status}">
                    </span>

          </td>

          <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">
          </td>

          <td>

            <a th:href="@{/manager/orders/{id}(id=${o.id})}"
               class="view-btn">
              Xem chi tiết
            </a>

          </td>

        </tr>

        <tr th:if="${orders.empty}">

          <td colspan="5"
              class="empty">

            📦 Chưa có đơn hàng.

          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <div class="pagination"
         th:if="${orders.totalPages > 1}">

        <span th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">

            <a th:href="@{/manager/users/{uid}(uid=${user.id}, page=${i})}"
               class="page-link"
               th:classappend="${i == orders.number} ? 'active' : ''"
               th:text="${i + 1}">
            </a>

        </span>

    </div>

  </div>

</div> </body> </html>
