<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Chi tiết người dùng - Manager</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #334155;
    }

    .container {
        width: 94%;
        max-width: 1200px;
        margin: 40px auto;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 30px 35px;
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: 0 8px 25px rgba(79, 70, 229, .2);
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 7px;
    }

    .header p {
        color: #e0e7ff;
        font-size: 14px;
    }

    .navigation {
        margin-bottom: 20px;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 17px;
        background: white;
        color: #4f46e5;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: .2s;
    }

    .back-btn:hover {
        background: #4f46e5;
        color: white;
    }

    /* Alert */
    .alert {
        padding: 13px 17px;
        border-radius: 9px;
        margin-bottom: 18px;
        font-size: 14px;
        font-weight: 500;
    }

    .success {
        color: #047857;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
    }

    .error {
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
    }

    /* Grid */
    .top-grid {
        display: grid;
        grid-template-columns: 1.3fr .7fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, .06);
    }

    .card-title {
        color: #1e293b;
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 20px;
    }

    /* User info */
    .info-list {
        display: flex;
        flex-direction: column;
    }

    .info-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 15px;
        padding: 14px 0;
        border-bottom: 1px solid #f1f5f9;
    }

    .info-row:last-child {
        border-bottom: none;
    }

    .info-label {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
    }

    .info-value {
        color: #1e293b;
        font-size: 14px;
        font-weight: 500;
        word-break: break-word;
    }

    .email {
        color: #4f46e5;
    }

    /* Role */
    .role-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 12px;
        font-weight: 700;
    }

    /* Role form */
    .role-form {
        display: flex;
        flex-direction: column;
        gap: 13px;
    }

    .role-form label {
        color: #475569;
        font-size: 13px;
        font-weight: 600;
    }

    .role-form select {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        color: #334155;
        font-size: 14px;
        outline: none;
    }

    .role-form select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
    }

    .update-btn {
        padding: 11px 18px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
    }

    .update-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(79, 70, 229, .25);
    }

    /* Orders */
    .orders-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, .06);
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
    }

    thead {
        background: #f8fafc;
    }

    th {
        text-align: left;
        padding: 14px 15px;
        color: #64748b;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .4px;
        border-bottom: 1px solid #e5e7eb;
    }

    td {
        padding: 14px 15px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    .order-id {
        color: #4f46e5;
        font-weight: 700;
    }

    .amount {
        color: #059669;
        font-weight: 700;
    }

    .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 20px;
        background: #f1f5f9;
        color: #475569;
        font-size: 11px;
        font-weight: 700;
    }

    .view-btn {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 7px;
        background: #eef2ff;
        color: #4f46e5;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        transition: .2s;
    }

    .view-btn:hover {
        background: #4f46e5;
        color: white;
    }

    .empty {
        text-align: center;
        color: #94a3b8;
        padding: 40px !important;
    }

    /* Pagination */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-top: 22px;
    }

    .page-link {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        text-decoration: none;
        color: #64748b;
        background: white;
        font-size: 13px;
        font-weight: 600;
    }

    .page-link:hover {
        background: #eef2ff;
        color: #4f46e5;
    }

    .page-link.active {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
    }

    @media (max-width: 800px) {
        .top-grid {
            grid-template-columns: 1fr;
        }

        .container {
            margin: 20px auto;
        }

        .header {
            padding: 23px;
        }

        .header h1 {
            font-size: 24px;
        }
    }

    @media (max-width: 500px) {
        .card,
        .orders-card {
            padding: 18px;
        }

        .info-row {
            grid-template-columns: 1fr;
            gap: 5px;
        }
    }
  </style>

</head> <body> <div class="container">
  <div class="header">
    <h1>
      👤 Chi tiết Người dùng:
      <span th:text="${user.email}"></span>
    </h1>

    <p>
      Xem thông tin và quản lý tài khoản người dùng
    </p>
  </div>

  <div class="navigation">
    <a href="/manager/users" class="back-btn">
      ← Danh sách người dùng
    </a>
  </div>

  <div th:if="${success}"
       class="alert success"
       th:text="${success}">
  </div>

  <div th:if="${error}"
       class="alert error"
       th:text="${error}">
  </div>

  <div class="top-grid">

    <!-- User information -->
    <div class="card">

      <div class="card-title">
        👤 Thông tin tài khoản
      </div>

      <div class="info-list">

        <div class="info-row">
          <div class="info-label">ID</div>
          <div class="info-value" th:text="${user.id}"></div>
        </div>

        <div class="info-row">
          <div class="info-label">Email</div>
          <div class="info-value email"
               th:text="${user.email}">
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Họ tên</div>
          <div class="info-value"
               th:text="${user.name}">
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Số điện thoại</div>
          <div class="info-value"
               th:text="${user.phone}">
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Địa chỉ</div>
          <div class="info-value"
               th:text="${user.address}">
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Vai trò</div>
          <div class="info-value">
                    <span class="role-badge"
                          th:text="${user.role}">
                    </span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Ngày đăng ký</div>
          <div class="info-value"
               th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">
          </div>
        </div>

      </div>
    </div>

    <!-- Change role -->
    <div class="card">

      <div class="card-title">
        🔐 Đổi vai trò
      </div>

      <form th:action="@{/manager/users/{id}/role(id=${user.id})}"
            method="post"
            class="role-form">

        <label for="role">
          Vai trò tài khoản
        </label>

        <select name="role" id="role">

          <option value="USER"
                  th:selected="${user.role.name() == 'USER'}">
            USER
          </option>

          <option value="MANAGER"
                  th:selected="${user.role.name() == 'MANAGER'}">
            MANAGER
          </option>

        </select>

        <button type="submit"
                class="update-btn">
          Cập nhật vai trò
        </button>

      </form>

    </div>

  </div>

  <!-- Order history -->
  <div class="orders-card">

    <div class="card-title">
      🛒 Lịch sử đơn hàng
    </div>

    <div class="table-wrapper">

      <table>

        <thead>
        <tr>
          <th>ID</th>
          <th>Tổng tiền</th>
          <th>Trạng thái</th>
          <th>Ngày đặt</th>
          <th>Chi tiết</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="o : ${orders.content}">

          <td class="order-id"
              th:text="'#' + ${o.id}">
          </td>

          <td class="amount"
              th:text="${o.finalAmount}">
          </td>

          <td>
                    <span class="status"
                          th:text="${o.status}">
                    </span>
          </td>

          <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">
          </td>

          <td>
            <a th:href="@{/manager/orders/{id}(id=${o.id})}"
               class="view-btn">
              Xem chi tiết
            </a>
          </td>

        </tr>

        <tr th:if="${orders.empty}">
          <td colspan="5" class="empty">
            📦 Chưa có đơn hàng.
          </td>
        </tr>

        </tbody>

      </table>

    </div>

    <div class="pagination"
         th:if="${orders.totalPages > 1}">

        <span th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">

            <a th:href="@{/manager/users/{uid}(uid=${user.id}, page=${i})}"
               class="page-link"
               th:classappend="${i == orders.number} ? 'active' : ''"
               th:text="${i + 1}">
            </a>

        </span>

    </div>

  </div>

</div> </body> </html>
