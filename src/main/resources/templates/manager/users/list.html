<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Người dùng - Manager</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #334155;
    }

    .container {
        width: 94%;
        max-width: 1250px;
        margin: 40px auto;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 30px 35px;
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: 0 8px 25px rgba(79, 70, 229, .2);
    }

    .header h1 {
        font-size: 29px;
        margin-bottom: 7px;
    }

    .header p {
        color: #e0e7ff;
        font-size: 14px;
    }

    /* Navigation */
    .navigation {
        margin-bottom: 20px;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 17px;
        background: white;
        color: #4f46e5;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: .2s;
    }

    .back-btn:hover {
        background: #4f46e5;
        color: white;
    }

    /* Alert */
    .alert-success {
        padding: 13px 17px;
        border-radius: 9px;
        margin-bottom: 18px;
        color: #047857;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        font-size: 14px;
    }

    /* Filter */
    .filter-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, .06);
    }

    .filter-title {
        font-size: 19px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 18px;
    }

    .filter-form {
        display: flex;
        align-items: flex-end;
        gap: 13px;
        flex-wrap: wrap;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .form-group label {
        color: #475569;
        font-size: 13px;
        font-weight: 600;
    }

    input,
    select {
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        color: #334155;
        font-family: inherit;
        font-size: 14px;
        outline: none;
    }

    input {
        min-width: 220px;
    }

    input:focus,
    select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
    }

    .filter-btn {
        padding: 11px 20px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
    }

    .filter-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(79, 70, 229, .25);
    }

    .clear-btn {
        padding: 10px 15px;
        border-radius: 8px;
        color: #64748b;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }

    .clear-btn:hover {
        background: #f1f5f9;
        color: #334155;
    }

    /* Active filters */
    .active-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #f1f5f9;
    }

    .filter-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        background: #eef2ff;
        color: #4f46e5;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    /* Table */
    .table-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, .06);
    }

    .table-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .table-title h2 {
        color: #1e293b;
        font-size: 20px;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 850px;
        border-collapse: collapse;
    }

    thead {
        background: #f8fafc;
    }

    th {
        text-align: left;
        padding: 14px 15px;
        color: #64748b;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .4px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .user-id {
        color: #4f46e5;
        font-weight: 700;
    }

    .email {
        color: #4f46e5;
        font-weight: 500;
    }

    .user-name {
        color: #1e293b;
        font-weight: 600;
    }

    .role-badge {
        display: inline-block;
        padding: 6px 11px;
        border-radius: 20px;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 11px;
        font-weight: 700;
    }

    .date {
        color: #64748b;
        white-space: nowrap;
        font-size: 13px;
    }

    .view-btn {
        display: inline-block;
        padding: 8px 13px;
        border-radius: 7px;
        background: #eef2ff;
        color: #4f46e5;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        transition: .2s;
    }

    .view-btn:hover {
        background: #4f46e5;
        color: white;
    }

    .empty {
        text-align: center;
        color: #94a3b8;
        padding: 45px !important;
    }

    /* Pagination */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 25px;
    }

    .page-link {
        width: 36px;
        height: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 7px;
        border: 1px solid #e2e8f0;
        background: white;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }

    .page-link:hover {
        background: #eef2ff;
        color: #4f46e5;
    }

    .page-link.active {
        background: #4f46e5;
        color: white;
        border-color: #4f46e5;
    }

    @media (max-width: 900px) {
        .filter-form {
            align-items: stretch;
        }

        .form-group,
        input,
        select {
            width: 100%;
        }

        .filter-btn,
        .clear-btn {
            text-align: center;
        }
    }

    @media (max-width: 600px) {
        .container {
            margin: 20px auto;
        }

        .header {
            padding: 23px;
        }

        .header h1 {
            font-size: 24px;
        }

        .filter-card,
        .table-card {
            padding: 18px;
        }
    }
  </style>

</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">

    <h1>👥 Quản lý Người dùng</h1>

    <p>
      Tìm kiếm, lọc và quản lý tài khoản người dùng
    </p>

  </div>

  <!-- Navigation -->
  <div class="navigation">

    <a href="/manager/dashboard"
       class="back-btn">
      ← Dashboard
    </a>

  </div>

  <!-- Success -->
  <div th:if="${success}"
       class="alert-success"
       th:text="${success}">
  </div>

  <!-- Filter -->
  <div class="filter-card">

    <div class="filter-title">
      🔎 Tìm kiếm & bộ lọc
    </div>

    <form method="get"
          action="/manager/users"
          class="filter-form">

      <div class="form-group">

        <label for="keyword">
          Tìm kiếm
        </label>

        <input type="text"
               id="keyword"
               name="keyword"
               placeholder="Tên hoặc email..."
               th:value="${keyword}">

      </div>

      <div class="form-group">

        <label for="role">
          Vai trò
        </label>

        <select name="role" id="role">

          <option value="">
            -- Tất cả --
          </option>

          <option th:each="r : ${roles}"
                  th:value="${r}"
                  th:text="${r}"
                  th:selected="${r == selectedRole}">
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="startDate">
          Đăng ký từ
        </label>

        <input type="date"
               id="startDate"
               name="startDate"
               th:value="${startDate}">

      </div>

      <div class="form-group">

        <label for="endDate">
          Đến ngày
        </label>

        <input type="date"
               id="endDate"
               name="endDate"
               th:value="${endDate}">

      </div>

      <button type="submit"
              class="filter-btn">
        🔍 Lọc
      </button>

      <a th:if="${keyword != null or selectedRole != null or startDate != null or endDate != null}"
         href="/manager/users"
         class="clear-btn">
        ✕ Xóa bộ lọc
      </a>

    </form>

    <!-- Active filters -->
    <div class="active-filters"
         th:if="${keyword != null and !#strings.isEmpty(keyword)
                 or selectedRole != null
                 or startDate != null
                 or endDate != null}">

        <span class="filter-tag"
              th:if="${keyword != null and !#strings.isEmpty(keyword)}">
            🔎
            <span th:text="${keyword}"></span>
        </span>

      <span class="filter-tag"
            th:if="${selectedRole != null}">
            👤
            <span th:text="${selectedRole}"></span>
        </span>

      <span class="filter-tag"
            th:if="${startDate != null}">
            📅 Từ:
            <span th:text="${startDate}"></span>
        </span>

      <span class="filter-tag"
            th:if="${endDate != null}">
            📅 Đến:
            <span th:text="${endDate}"></span>
        </span>

    </div>

  </div>

  <!-- Users table -->
  <div class="table-card">

    <div class="table-title">

      <h2>
        👥 Danh sách người dùng
      </h2>

    </div>

    <div class="table-wrapper">

      <table>

        <thead>

        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Họ tên</th>
          <th>Vai trò</th>
          <th>Ngày đăng ký</th>
          <th>Chi tiết</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="u : ${users.content}">

          <td class="user-id"
              th:text="'#' + ${u.id}">
          </td>

          <td class="email"
              th:text="${u.email}">
          </td>

          <td class="user-name"
              th:text="${u.name}">
          </td>

          <td>

                    <span class="role-badge"
                          th:text="${u.role}">
                    </span>

          </td>

          <td class="date"
              th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}">
          </td>

          <td>

            <a th:href="@{/manager/users/{id}(id=${u.id})}"
               class="view-btn">
              👁 Xem
            </a>

          </td>

        </tr>

        <tr th:if="${users.empty}">

          <td colspan="6"
              class="empty">

            👤 Không tìm thấy người dùng phù hợp.

          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <!-- Pagination -->
    <div class="pagination"
         th:if="${users.totalPages > 1}">

        <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">

            <a th:href="@{/manager/users(
                    page=${i},
                    keyword=${keyword},
                    role=${selectedRole},
                    startDate=${startDate},
                    endDate=${endDate}
                )}"
               class="page-link"
               th:classappend="${i == users.number} ? 'active' : ''"
               th:text="${i + 1}">
            </a>

        </span>

    </div>

  </div>

</div> </body> </html>
