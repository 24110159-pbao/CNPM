<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sản phẩm - Manager</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #334155;
        min-height: 100vh;
    }

    .container {
        width: 94%;
        max-width: 1250px;
        margin: 40px auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: white;
        padding: 28px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.20);
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 29px;
        font-weight: 700;
        margin-bottom: 7px;
    }

    .header p {
        color: #dbeafe;
        font-size: 14px;
        line-height: 1.5;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .nav-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        text-decoration: none;

        padding: 10px 17px;

        border-radius: 8px;

        font-size: 14px;
        font-weight: 600;

        transition: all 0.2s ease;
    }

    /* Dashboard */

    .dashboard-btn {
        color: #2563eb;
        background: white;
        border: 1px solid #dbe3ef;
    }

    .dashboard-btn:hover {
        background: #2563eb;
        color: white;
        border-color: #2563eb;

        transform: translateY(-1px);

        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    }

    /* Add */

    .add-btn {
        background: #2563eb;
        color: white;
        border: 1px solid #2563eb;
    }

    .add-btn:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;

        transform: translateY(-1px);

        box-shadow: 0 5px 12px rgba(37, 99, 235, 0.22);
    }

    /* =========================
       ALERT
    ========================= */

    .alert {
        padding: 13px 17px;

        border-radius: 9px;

        margin-bottom: 18px;

        font-size: 14px;
        font-weight: 500;
    }

    .alert-success {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
    }

    .alert-error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }

    /* =========================
       TABLE CARD
    ========================= */

    .table-card {
        background: white;

        border: 1px solid #e2e8f0;

        border-radius: 16px;

        padding: 25px;

        box-shadow:
            0 5px 20px rgba(15, 23, 42, 0.06);
    }

    .table-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 20px;
    }

    .filter-form {
        display: flex;
        align-items: end;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .filter-form label {
        display: grid;
        gap: 5px;
        color: #475569;
        font-size: 13px;
        font-weight: 600;
    }

    .filter-form select,
    .filter-form button,
    .filter-reset {
        min-height: 38px;
        padding: 7px 11px;
        border: 1px solid #dbe3ef;
        border-radius: 7px;
        background: white;
        color: #334155;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
    }

    .filter-form button {
        border-color: #2563eb;
        background: #2563eb;
        color: white;
    }

    .table-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: #1e293b;
    }

    .product-count {
        color: #64748b;
        font-size: 13px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 950px;

        border-collapse: collapse;
    }

    thead {
        background: #eff6ff;
    }

    th {
        text-align: left;

        padding: 14px 15px;

        color: #475569;

        font-size: 12px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 0.4px;

        border-bottom: 1px solid #dbeafe;

        white-space: nowrap;
    }

    td {
        padding: 15px;

        border-bottom: 1px solid #f1f5f9;

        font-size: 14px;

        vertical-align: middle;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f8fbff;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    /* =========================
       ID
    ========================= */

    .product-id {
        color: #2563eb;
        font-weight: 700;
    }

    /* =========================
       PRODUCT NAME
    ========================= */

    .product-name {
        color: #1e293b;
        font-weight: 600;
    }

    /* =========================
       CATEGORY
    ========================= */

    .category {
        display: inline-block;

        background: #eff6ff;
        color: #2563eb;

        padding: 5px 9px;

        border-radius: 6px;

        font-size: 12px;
        font-weight: 600;

        border: 1px solid #dbeafe;
    }

    /* =========================
       PRICE
    ========================= */

    .price {
        color: #dc2626;

        font-weight: 700;

        white-space: nowrap;
    }

    /* =========================
       STOCK
    ========================= */

    .stock {
        display: inline-block;

        min-width: 35px;

        padding: 4px 8px;

        text-align: center;

        background: #eff6ff;
        color: #2563eb;

        border-radius: 6px;

        font-weight: 600;
    }

    .stock-low {
        background: #fef2f2;
        color: #dc2626;
    }

    /* =========================
       STATUS
    ========================= */

    .status-active,
    .status-hidden {
        display: inline-block;

        padding: 6px 10px;

        border-radius: 20px;

        font-size: 11px;

        font-weight: 700;

        white-space: nowrap;
    }

    .status-active {
        background: #ecfdf5;
        color: #059669;
    }

    .status-hidden {
        background: #f1f5f9;
        color: #64748b;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
        display: flex;

        align-items: center;

        gap: 7px;
    }

    .actions form {
        margin: 0;
    }

    .edit-btn,
    .toggle-btn,
    .delete-btn {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        padding: 7px 11px;

        border: none;

        border-radius: 7px;

        font-size: 12px;

        font-weight: 600;

        text-decoration: none;

        cursor: pointer;

        transition: all 0.2s ease;

        white-space: nowrap;
    }

    /* Edit */

    .edit-btn {
        background: #dbeafe;
        color: #2563eb;
    }

    .edit-btn:hover {
        background: #2563eb;
        color: white;

        transform: translateY(-1px);

        box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
    }

    /* Toggle */

    .toggle-btn {
        background: #fff7ed;
        color: #ea580c;
    }

    .toggle-btn:hover {
        background: #ea580c;
        color: white;

        transform: translateY(-1px);
    }

    /* Delete */

    .delete-btn {
        background: #fef2f2;
        color: #dc2626;
    }

    .delete-btn:hover {
        background: #dc2626;
        color: white;

        transform: translateY(-1px);

        box-shadow: 0 3px 8px rgba(220, 38, 38, 0.18);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        text-align: center;

        padding: 45px !important;

        color: #94a3b8;

        font-style: italic;
    }

    /* =========================
       PAGINATION
    ========================= */

    .pagination {
        display: flex;

        justify-content: center;

        align-items: center;

        gap: 7px;

        margin-top: 25px;
    }

    .page-link {
        width: 36px;
        height: 36px;

        display: flex;

        justify-content: center;

        align-items: center;

        text-decoration: none;

        background: white;

        color: #64748b;

        border: 1px solid #dbe3ef;

        border-radius: 7px;

        font-size: 14px;

        font-weight: 600;

        transition: all 0.2s ease;
    }

    .page-link:hover {
        background: #eff6ff;

        color: #2563eb;

        border-color: #93c5fd;
    }

    .page-link.active {
        background: #2563eb;

        color: white;

        border-color: #2563eb;

        box-shadow: 0 3px 8px rgba(37, 99, 235, 0.20);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 768px) {

        .container {
            width: 94%;
            margin: 20px auto;
        }

        .header {
            padding: 22px;

            border-radius: 14px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            font-size: 13px;
        }

        .navigation {
            flex-direction: column;
        }

        .nav-btn {
            width: 100%;
        }

        .table-card {
            padding: 18px;

            border-radius: 14px;
        }

        .table-header {
            align-items: flex-start;

            flex-direction: column;

            gap: 6px;
        }

        .actions {
            flex-wrap: wrap;
        }
    }

    @media (max-width: 480px) {

        .container {
            width: 96%;
            margin: 15px auto;
        }

        .header {
            padding: 20px;
        }

        .header h1 {
            font-size: 21px;
        }

        .table-card {
            padding: 15px;
        }

        .table-header h2 {
            font-size: 18px;
        }
    }
  </style>


</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Quản lý Sản phẩm</h1>
    <p>Quản lý sản phẩm, giá bán, tồn kho và trạng thái hiển thị</p>
  </div>

  <!-- Navigation -->
  <div class="navigation">

    <a href="/manager/dashboard"
       class="nav-btn dashboard-btn">
      ← Dashboard
    </a>

    <a href="/manager/products/create"
       class="nav-btn add-btn">
      + Thêm sản phẩm
    </a>

  </div>

  <!-- Alerts -->
  <div th:if="${success}"
       class="alert alert-success"
       th:text="${success}">
  </div>

  <div th:if="${error}"
       class="alert alert-error"
       th:text="${error}">
  </div>

  <!-- Product table -->
  <div class="table-card">

    <div class="table-header">

      <h2>📦 Danh sách sản phẩm</h2>

      <span class="product-count"
            th:text="'Tổng: ' + ${products.totalElements} + ' sản phẩm'">
            Tổng sản phẩm
        </span>

    </div>

        <form class="filter-form" method="get" action="/manager/products">
            <label for="category-filter">Lọc theo danh mục
                <select id="category-filter" name="categoryId">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${category.id == selectedCategoryId}"></option>
                </select>
            </label>
            <button type="submit">Lọc</button>
            <a class="filter-reset" th:if="${selectedCategoryId != null}" href="/manager/products">Xóa lọc</a>
        </form>

    <div class="table-wrapper">

      <table>

        <thead>
        <tr>
          <th>ID</th>
          <th>Tên</th>
          <th>Danh mục</th>
          <th>Giá</th>
          <th>Tồn kho</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="p : ${products.content}">

          <td class="product-id"
              th:text="${p.id}">
          </td>

          <td class="product-name"
              th:text="${p.name}">
          </td>

          <td>
                    <span class="category"
                          th:text="${p.category?.name != null ? p.category.name : 'Chưa phân loại'}">
                    </span>
          </td>

          <td class="price"
              th:text="${p.price}">
          </td>

          <td>
                    <span class="stock"
                          th:classappend="${p.stock <= 5} ? 'stock-low' : ''"
                          th:text="${p.stock}">
                    </span>
          </td>

          <td>

                    <span th:if="${p.status}"
                          class="status-active">
                        ● Hoạt động
                    </span>

            <span th:unless="${p.status}"
                  class="status-hidden">
                        ● Ẩn
                    </span>

          </td>

          <td>

            <div class="actions">

              <a th:href="@{/manager/products/{id}/edit(id=${p.id})}"
                 class="edit-btn">
                ✏ Sửa
              </a>

              <form th:action="@{/manager/products/{id}/toggle-status(id=${p.id})}"
                    method="post">

                <input type="hidden"
                       name="status"
                       th:value="${!p.status}">

                <button type="submit"
                        class="toggle-btn"
                        th:text="${p.status} ? 'Ẩn' : 'Hiện'">
                </button>

              </form>

              <form th:action="@{/manager/products/{id}/delete(id=${p.id})}"
                    method="post"
                    onsubmit="return confirm('Xóa sản phẩm này?')">

                <button type="submit"
                        class="delete-btn">
                  🗑 Xóa
                </button>

              </form>

            </div>

          </td>

        </tr>

        <tr th:if="${products.empty}">
          <td colspan="7" class="empty">
            📦 Chưa có sản phẩm nào.
          </td>
        </tr>

        </tbody>

      </table>

    </div>

    <!-- Pagination -->
    <div class="pagination"
         th:if="${products.totalPages > 1}">

        <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">

            <a th:href="@{/manager/products(page=${i}, categoryId=${selectedCategoryId})}"
               class="page-link"
               th:classappend="${i == products.number} ? 'active' : ''"
               th:text="${i + 1}">
                1
            </a>

        </span>

    </div>

  </div>

</div> </body> </html>
