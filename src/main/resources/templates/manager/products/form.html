<!DOCTYPE html> <html xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sản phẩm - Manager</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #334155;
        min-height: 100vh;
    }

    .container {
        width: 94%;
        max-width: 1100px;
        margin: 40px auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: white;
        padding: 28px 35px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.20);
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 29px;
        font-weight: 700;
        margin-bottom: 7px;
    }

    .header p {
        color: #dbeafe;
        font-size: 14px;
        line-height: 1.5;
    }

    /* =========================
       BACK BUTTON
    ========================= */

    .back-link {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: #2563eb;
        background: white;
        border: 1px solid #dbe3ef;
        padding: 10px 17px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 20px;
        transition: all 0.2s ease;
    }

    .back-link:hover {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.18);
    }

    /* =========================
       ALERT
    ========================= */

    .alert-error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
        padding: 13px 17px;
        border-radius: 9px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
    }

    /* =========================
       FORM CARD
    ========================= */

    .form-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
        display: flex;
        align-items: center;
        gap: 9px;

        color: #1e293b;
        font-size: 19px;
        font-weight: 700;

        padding-bottom: 14px;
        margin-bottom: 20px;

        border-bottom: 1px solid #e2e8f0;
    }

    .section-title:not(:first-child) {
        margin-top: 30px;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
        margin-bottom: 18px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    label {
        display: block;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    /* =========================
       INPUT / SELECT / TEXTAREA
    ========================= */

    input[type="text"],
    input[type="number"],
    select,
    textarea {
        width: 100%;
        padding: 11px 13px;

        border: 1px solid #cbd5e1;
        border-radius: 8px;

        background: #fff;
        color: #374151;

        font-family: inherit;
        font-size: 14px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    input[type="text"]:hover,
    input[type="number"]:hover,
    select:hover,
    textarea:hover {
        border-color: #93c5fd;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        background: #ffffff;
    }

    input::placeholder,
    textarea::placeholder {
        color: #9ca3af;
    }

    select {
        cursor: pointer;
    }

    textarea {
        resize: vertical;
        min-height: 115px;
        line-height: 1.5;
    }

    /* =========================
       IMAGE
    ========================= */

    .image-box {
        border: 2px dashed #bfdbfe;
        border-radius: 12px;
        padding: 20px;

        background: #f8fbff;

        transition: all 0.2s ease;
    }

    .image-box:hover {
        border-color: #60a5fa;
        background: #eff6ff;
    }

    .current-image {
        display: block;

        width: 140px;
        height: 140px;

        object-fit: cover;

        border-radius: 10px;
        border: 1px solid #dbeafe;

        background: white;

        margin-bottom: 15px;

        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
    }

    input[type="file"] {
        width: 100%;

        padding: 10px;

        border: 1px solid #cbd5e1;
        border-radius: 8px;

        background: white;

        font-family: inherit;
        font-size: 13px;
        color: #64748b;

        cursor: pointer;

        transition: border-color 0.2s ease;
    }

    input[type="file"]:hover {
        border-color: #60a5fa;
    }

    input[type="file"]::file-selector-button {
        border: none;

        background: #dbeafe;
        color: #2563eb;

        padding: 7px 12px;
        margin-right: 10px;

        border-radius: 6px;

        font-size: 13px;
        font-weight: 600;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
        background: #bfdbfe;
        color: #1d4ed8;
    }

    .image-note {
        display: block;

        color: #94a3b8;
        font-size: 12px;

        margin-top: 8px;
    }

    /* =========================
       FORM ACTION
    ========================= */

    .form-actions {
        margin-top: 25px;
        padding-top: 20px;

        border-top: 1px solid #e2e8f0;
    }

    .submit-btn {
        width: 100%;

        padding: 13px;

        border: none;
        border-radius: 9px;

        background: linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

        color: white;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    .submit-btn:hover {
        background: linear-gradient(
            135deg,
            #1d4ed8,
            #0284c7
        );

        transform: translateY(-1px);

        box-shadow:
            0 5px 15px rgba(37, 99, 235, 0.25);
    }

    .submit-btn:active {
        transform: translateY(0);
        box-shadow: none;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

        .container {
            width: 94%;
            margin: 20px auto;
        }

        .header {
            padding: 22px;
            border-radius: 14px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            font-size: 13px;
        }

        .form-card {
            padding: 22px;
            border-radius: 14px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .section-title {
            font-size: 18px;
        }

        .current-image {
            width: 120px;
            height: 120px;
        }
    }

    @media (max-width: 480px) {

        .container {
            width: 96%;
            margin: 15px auto;
        }

        .header {
            padding: 20px;
        }

        .header h1 {
            font-size: 21px;
        }

        .form-card {
            padding: 18px;
        }

        .back-link {
            width: 100%;
            justify-content: center;
        }

        .section-title {
            font-size: 17px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            font-size: 14px;
        }

        .image-box {
            padding: 15px;
        }
    }
  </style>


</head> <body> <div class="container">
  <!-- Header -->
  <div class="header">
    <h1 th:text="${product != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm'">
      Form sản phẩm
    </h1>

    <p>
      Quản lý thông tin, giá bán, tồn kho và thông số sản phẩm
    </p>
  </div>

  <!-- Back -->
  <a href="/manager/products" class="back-link">
    ← Quay lại danh sách
  </a>

  <!-- Error -->
  <div th:if="${error}"
       class="alert-error"
       th:text="${error}">
  </div>

  <!-- Form -->
  <div class="form-card">

    <form th:action="${product != null} ? @{/manager/products/{id}/edit(id=${product.id})} : @{/manager/products/create}"
          method="post"
          enctype="multipart/form-data">

      <!-- Basic information -->
      <h2 class="section-title">
        📦 Thông tin sản phẩm
      </h2>

      <div class="form-group">

        <label for="categoryId">
          Danh mục
        </label>

        <select name="categoryId"
                id="categoryId"
                required>

          <option value="">
            -- Chọn danh mục --
          </option>

          <option th:each="c : ${categories}"
                  th:value="${c.id}"
                  th:text="${c.name}"
                  th:selected="${product != null and product.category?.id == c.id}">
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="name">
          Tên sản phẩm
        </label>

        <input type="text"
               id="name"
               name="name"
               placeholder="Nhập tên sản phẩm..."
               required
               th:value="${product?.name}">

      </div>

      <div class="form-group">

        <label for="description">
          Mô tả sản phẩm
        </label>

        <textarea id="description"
                  name="description"
                  placeholder="Nhập mô tả sản phẩm..."
                  th:text="${product?.description}"></textarea>

      </div>

      <!-- Price & stock -->
      <h2 class="section-title">
        💰 Giá & tồn kho
      </h2>

      <div class="form-row">

        <div class="form-group">

          <label for="price">
            Giá sản phẩm
          </label>

          <input type="number"
                 id="price"
                 name="price"
                 step="0.01"
                 min="0"
                 placeholder="Ví dụ: 15990000"
                 required
                 th:value="${product?.price}">

        </div>

        <div class="form-group">

          <label for="stock">
            Tồn kho
          </label>

          <input type="number"
                 id="stock"
                 name="stock"
                 min="0"
                 placeholder="Ví dụ: 100"
                 required
                 th:value="${product?.stock}">

        </div>

      </div>

      <!-- Specifications -->
      <h2 class="section-title">
        ⚙️ Thông số kỹ thuật
      </h2>

      <div class="form-row">

        <div class="form-group">

          <label for="ram">
            RAM
          </label>

          <input type="text"
                 id="ram"
                 name="ram"
                 placeholder="Ví dụ: 8GB"
                 th:value="${product?.productSpec?.ram}">

        </div>

        <div class="form-group">

          <label for="storage">
            Bộ nhớ trong
          </label>

          <input type="text"
                 id="storage"
                 name="storage"
                 placeholder="Ví dụ: 256GB"
                 th:value="${product?.productSpec?.storage}">

        </div>

      </div>

      <div class="form-row">

        <div class="form-group">

          <label for="color">
            Màu sắc
          </label>

          <input type="text"
                 id="color"
                 name="color"
                 placeholder="Ví dụ: Đen"
                 th:value="${product?.productSpec?.color}">

        </div>

        <div class="form-group">

          <label for="screenSize">
            Kích thước màn hình
          </label>

          <input type="text"
                 id="screenSize"
                 name="screenSize"
                 placeholder="Ví dụ: 6.7 inch"
                 th:value="${product?.productSpec?.screenSize}">

        </div>

      </div>

      <div class="form-group">

        <label for="battery">
          Dung lượng pin
        </label>

        <input type="text"
               id="battery"
               name="battery"
               placeholder="Ví dụ: 5000mAh"
               th:value="${product?.productSpec?.battery}">

      </div>

      <!-- Image -->
      <h2 class="section-title">
        🖼️ Hình ảnh sản phẩm
      </h2>

      <div class="image-box">

        <img th:if="${product?.imageUrl}"
             th:src="${product.imageUrl}"
             class="current-image">

        <input type="file"
               name="image"
               accept="image/*">

        <span class="image-note">
                Để trống nếu bạn không muốn thay đổi ảnh hiện tại.
            </span>

      </div>

      <!-- Submit -->
      <div class="form-actions">

        <button type="submit"
                class="submit-btn"
                th:text="${product != null} ? '✓ Cập nhật sản phẩm' : '+ Thêm sản phẩm'">
          Lưu
        </button>

      </div>

    </form>

  </div>

</div> </body> </html>
