<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đơn hàng - Manager</title></head>
<body>
<h1>Quản lý Đơn hàng</h1>
<a href="/manager/dashboard">Dashboard</a>
<hr>
<div th:if="${success}" style="color:green" th:text="${success}"></div>

<form method="get" action="/manager/orders">
  <label>Trạng thái:</label>
  <select name="status">
    <option value="">-- Tất cả --</option>
    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
            th:selected="${s == selectedStatus}"></option>
  </select>

  <label>Từ ngày:</label>
  <input type="date" name="startDate" th:value="${startDate}">

  <label>Đến ngày:</label>
  <input type="date" name="endDate" th:value="${endDate}">

  <button type="submit">Lọc</button>

  <a th:if="${selectedStatus != null or startDate != null}" href="/manager/orders">Xóa bộ lọc</a>
</form>

<p>
  <span th:if="${selectedStatus != null}">Trạng thái: <b th:text="${selectedStatus}"></b> &nbsp;</span>
  <span th:if="${startDate != null}">Từ: <b th:text="${startDate}"></b> &nbsp;</span>
  <span th:if="${endDate != null}">Đến: <b th:text="${endDate}"></b></span>
</p>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>ID</th><th>Khách hàng</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày đặt</th><th>Chi tiết</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="o : ${orders.content}">
      <td th:text="${o.id}"></td>
      <td th:text="${o.user?.email}"></td>
      <td th:text="${o.finalAmount}"></td>
      <td th:text="${o.payment?.method}"></td>
      <td th:text="${o.status}"></td>
      <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
      <td><a th:href="@{/manager/orders/{id}(id=${o.id})}">Xem</a></td>
    </tr>
    <tr th:if="${orders.empty}">
      <td colspan="7">Không có đơn hàng phù hợp.</td>
    </tr>
  </tbody>
</table>

<div th:if="${orders.totalPages > 1}">
  <span th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">
    <a th:href="@{/manager/orders(page=${i}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate})}"
       th:text="${i + 1}"
       th:style="${i == orders.number} ? 'font-weight:bold' : ''"></a>
  </span>
</div>
</body>
</html>
