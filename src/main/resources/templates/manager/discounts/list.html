<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mã giảm giá - Manager</title>

  <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
        min-height: 100vh;
    }

    .container {
        width: 94%;
        max-width: 1250px;
        margin: 40px auto;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
        background: linear-gradient(
            135deg,
            #0874e9,
            #0056c9
        );

        color: white;

        padding: 28px 35px;

        border-radius: 12px;

        box-shadow:
            0 8px 25px rgba(0, 86, 201, 0.20);

        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 29px;
        margin-bottom: 7px;
        font-weight: 700;
    }

    .header p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .navigation {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .nav-btn {
        display: inline-block;
        text-decoration: none;

        padding: 10px 17px;

        border-radius: 8px;

        font-size: 14px;

        font-weight: 600;

        transition: 0.2s;
    }


    /* Dashboard */

    .dashboard-btn {
        color: #0874e9;

        background: white;

        border: 1px solid #dbeafe;
    }

    .dashboard-btn:hover {
        background: #0874e9;
        color: white;

        border-color: #0874e9;

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(8, 116, 233, 0.18);
    }


    /* Add */

    .add-btn {
        background: #0874e9;
        color: white;

        border: 1px solid #0874e9;
    }

    .add-btn:hover {
        background: #0056c9;
        border-color: #0056c9;

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(8, 116, 233, 0.20);
    }


    /* =====================================================
       ALERT
    ===================================================== */

    .alert {
        padding: 13px 17px;

        border-radius: 9px;

        margin-bottom: 18px;

        font-size: 14px;

        font-weight: 500;
    }

    .alert-success {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
    }

    .alert-error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }


    /* =====================================================
       TABLE CARD
    ===================================================== */

    .table-card {
        background: white;

        border-radius: 12px;

        padding: 25px;

        box-shadow:
            0 5px 20px rgba(15, 23, 42, 0.06);

        border: 1px solid #e5e7eb;
    }

    .table-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        margin-bottom: 20px;
    }

    .table-header h2 {
        font-size: 20px;
        color: #1f2937;
    }

    .table-count {
        color: #64748b;
        font-size: 13px;
    }


    /* =====================================================
       TABLE
    ===================================================== */

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;

        border-collapse: collapse;

        min-width: 900px;
    }

    thead {
        background: #f5faff;
    }

    th {
        text-align: left;

        padding: 14px 15px;

        color: #64748b;

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 0.4px;

        border-bottom: 1px solid #dbeafe;

        white-space: nowrap;
    }

    td {
        padding: 15px;

        border-bottom: 1px solid #f1f5f9;

        vertical-align: middle;

        font-size: 14px;
    }

    tbody tr {
        transition: background 0.2s;
    }

    tbody tr:hover {
        background: #f8fbff;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }


    /* =====================================================
       ID
    ===================================================== */

    .id {
        color: #0874e9;
        font-weight: 700;
    }


    /* =====================================================
       COUPON CODE
    ===================================================== */

    .coupon-code {
        display: inline-block;

        background: #eaf4ff;

        color: #0874e9;

        border: 1px dashed #7db8f5;

        padding: 6px 10px;

        border-radius: 6px;

        font-weight: 700;

        letter-spacing: 0.5px;

        font-size: 13px;
    }


    /* =====================================================
       DISCOUNT
    ===================================================== */

    .discount-badge {
        display: inline-block;

        background: #fff7ed;

        color: #ea580c;

        padding: 5px 9px;

        border-radius: 6px;

        font-weight: 700;

        font-size: 13px;
    }


    /* =====================================================
       QUANTITY
    ===================================================== */

    .quantity {
        color: #475569;
        font-weight: 600;
    }


    /* =====================================================
       DATE
    ===================================================== */

    .date {
        color: #64748b;

        white-space: nowrap;

        font-size: 13px;
    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    .actions {
        display: flex;

        align-items: center;

        gap: 8px;
    }

    .edit-btn,
    .delete-btn {
        border-radius: 7px;

        padding: 8px 12px;

        font-size: 13px;

        font-weight: 600;

        cursor: pointer;

        text-decoration: none;

        border: none;

        transition: 0.2s;
    }


    /* Edit */

    .edit-btn {
        background: #eaf4ff;
        color: #0874e9;
    }

    .edit-btn:hover {
        background: #0874e9;
        color: white;

        box-shadow:
            0 4px 10px rgba(8, 116, 233, 0.18);
    }


    /* Delete */

    .delete-btn {
        background: #fef2f2;
        color: #dc2626;
    }

    .delete-btn:hover {
        background: #dc2626;
        color: white;
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
        text-align: center;

        padding: 45px !important;

        color: #94a3b8;

        font-style: italic;
    }


    /* =====================================================
       PAGINATION
    ===================================================== */

    .pagination {
        display: flex;

        justify-content: center;

        align-items: center;

        gap: 7px;

        margin-top: 25px;
    }

    .page-link {
        min-width: 36px;

        height: 36px;

        display: flex;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        color: #64748b;

        background: white;

        border: 1px solid #dbeafe;

        border-radius: 7px;

        font-size: 14px;

        font-weight: 600;

        transition: 0.2s;
    }

    .page-link:hover {
        background: #eaf4ff;

        color: #0874e9;

        border-color: #9bc8f7;
    }

    .page-link.active {
        background: #0874e9;

        color: white;

        border-color: #0874e9;

        box-shadow:
            0 3px 8px rgba(8, 116, 233, 0.20);
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 768px) {

        .container {
            width: 94%;
            margin: 20px auto;
        }

        .header {
            padding: 22px;
        }

        .header h1 {
            font-size: 24px;
        }

        .table-card {
            padding: 18px;
        }

        .table-header {
            align-items: flex-start;

            flex-direction: column;

            gap: 5px;
        }

    }

  </style>

</head>


<body>

<div class="container">


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <div class="header">

    <h1>
      Quản lý Mã giảm giá
    </h1>

    <p>
      Tạo, chỉnh sửa và quản lý các mã giảm giá của hệ thống
    </p>

  </div>


  <!-- =====================================================
       NAVIGATION
  ===================================================== -->

  <div class="navigation">

    <a href="/manager/dashboard"
       class="nav-btn dashboard-btn">

      ← Dashboard

    </a>


    <a href="/manager/discounts/create"
       class="nav-btn add-btn">

      + Thêm mã giảm giá

    </a>

  </div>


  <!-- =====================================================
       MESSAGES
  ===================================================== -->

  <div th:if="${success}"
       class="alert alert-success"
       th:text="${success}">

  </div>


  <div th:if="${error}"
       class="alert alert-error"
       th:text="${error}">

  </div>


  <!-- =====================================================
       TABLE
  ===================================================== -->

  <div class="table-card">


    <div class="table-header">

      <h2>
        🎟️ Danh sách mã giảm giá
      </h2>

      <span class="table-count"
            th:text="'Tổng: ' + ${discounts.totalElements} + ' mã'">

                Tổng mã

            </span>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

        <tr>

          <th>ID</th>

          <th>Mã</th>

          <th>Giảm giá</th>

          <th>Số lượng</th>

          <th>Bắt đầu</th>

          <th>Kết thúc</th>

          <th>Hành động</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="d : ${discounts.content}">


          <!-- ID -->

          <td class="id"
              th:text="${d.id}">

          </td>


          <!-- CODE -->

          <td>

                        <span class="coupon-code"
                              th:text="${d.code}">

                        </span>

          </td>


          <!-- DISCOUNT -->

          <td>

                        <span class="discount-badge"
                              th:text="${d.discountValue + '%'}">

                        </span>

          </td>


          <!-- QUANTITY -->

          <td class="quantity"
              th:text="${d.quantity}">

          </td>


          <!-- START -->

          <td class="date"
              th:text="${#temporals.format(
                            d.startAt,
                            'dd/MM/yyyy HH:mm'
                        )}">

          </td>


          <!-- END -->

          <td class="date"
              th:text="${#temporals.format(
                            d.endAt,
                            'dd/MM/yyyy HH:mm'
                        )}">

          </td>


          <!-- ACTIONS -->

          <td>

            <div class="actions">


              <a th:href="@{/manager/discounts/{id}/edit(id=${d.id})}"
                 class="edit-btn">

                ✏ Sửa

              </a>


              <form th:action="@{/manager/discounts/{id}/delete(id=${d.id})}"
                    method="post"

                    onsubmit="return confirm('Xóa mã này?')">

                <button type="submit"
                        class="delete-btn">

                  🗑 Xóa

                </button>

              </form>


            </div>

          </td>


        </tr>


        <!-- EMPTY -->

        <tr th:if="${discounts.empty}">

          <td colspan="7"
              class="empty">

            🎟️ Chưa có mã giảm giá nào.

          </td>

        </tr>


        </tbody>

      </table>

    </div>


    <!-- =================================================
         PAGINATION
    ================================================= -->

    <div class="pagination"
         th:if="${discounts.totalPages > 1}">


            <span th:each="i : ${#numbers.sequence(
                0,
                discounts.totalPages - 1
            )}">


                <a th:href="@{/manager/discounts(page=${i})}"

                   class="page-link"

                   th:classappend="${i == discounts.number}
                       ? 'active'
                       : ''"

                   th:text="${i + 1}">

                    1

                </a>


            </span>


    </div>


  </div>


</div>

</body>

</html>
