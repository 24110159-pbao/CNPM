<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Giỏ hàng')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-4">
    <h3 class="border-bottom pb-2 mb-4">🛒 Giỏ hàng của bạn</h3>

    <div th:if="${cart != null and not #lists.isEmpty(cart.items)}" class="row">
        <div class="col-lg-8">
            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 40%;">Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th style="width: 25%;">Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td>
                            <div class="d-flex align-items-center">
                                <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()}" th:src="${item.product.imageUrl}" class="me-3 rounded border" style="width: 50px; height: 50px; object-fit: cover;">
                                <div>
                                    <a th:href="@{/products/{id}(id=${item.product.id})}" class="text-decoration-none fw-bold text-dark" th:text="${item.product.name}">Tên SP</a>
                                    <div class="text-muted small" th:text="'Kho: ' + ${item.product.stock}"></div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <form th:action="@{/cart/decrease/{id}(id=${item.product.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm px-2">-</button>
                                </form>
                                <span class="mx-3 fw-bold" th:text="${item.quantity}">1</span>
                                <form th:action="@{/cart/increase/{id}(id=${item.product.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm px-2" th:disabled="${item.quantity >= item.product.stock}">+</button>
                                </form>
                            </div>
                        </td>
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</td>
                        <td>
                            <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa món này?')">🗑️</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/products}" class="btn btn-outline-primary">&laquo; Tiếp tục mua sắm</a>
                <form th:action="@{/cart/clear}" method="post">
                    <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Bạn có chắc muốn xóa toàn bộ giỏ hàng?')">Xóa tất cả</button>
                </form>
            </div>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="card shadow-sm border">
                <div class="card-header bg-white fw-bold py-3">Tóm tắt đơn hàng</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Số lượng sản phẩm:</span>
                        <span class="fw-bold" th:text="${#lists.size(cart.items)}">0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Tạm tính:</span>
                        <span class="fs-5 text-danger fw-bold" th:text="${#numbers.formatDecimal(#aggregates.sum(cart.items.![product.price * quantity]), 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-success w-100 py-2 fs-5">Tiến hành đặt hàng &raquo;</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Giỏ hàng rỗng -->
    <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="text-center py-5">
        <div class="display-1 text-muted mb-3">🛒</div>
        <h4>Giỏ hàng của bạn đang trống!</h4>
        <p class="text-muted">Hãy thêm vài sản phẩm yêu thích vào giỏ hàng ngay nhé.</p>
        <a th:href="@{/products}" class="btn btn-primary mt-2">Duyệt sản phẩm</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
