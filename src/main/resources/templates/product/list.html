<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Danh sách sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-4">
    <div class="row">
        <!-- Sidebar lọc danh mục -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white fw-bold">Danh mục</div>
                <div class="list-group list-group-flush">
                    <a th:href="@{/products}" class="list-group-item list-group-item-action" th:classappend="${category == null} ? 'active'">Tất cả sản phẩm</a>
                    <a th:each="cat : ${categories}" th:href="@{/categories/{id}(id=${cat.id})}" class="list-group-item list-group-item-action" th:classappend="${category != null and category.id == cat.id} ? 'active'" th:text="${cat.name}">Danh mục</a>
                </div>
            </div>
        </div>

        <!-- Danh sách sản phẩm -->
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 th:if="${category != null}" th:text="'Danh mục: ' + ${category.name}"></h4>
                <h4 th:if="${keyword != null and !keyword.isEmpty()}" th:text="'Kết quả tìm kiếm: &quot;' + ${keyword} + '&quot;'"></h4>
                <h4 th:if="${category == null and (keyword == null or keyword.isEmpty())}">Tất cả sản phẩm</h4>
                <span class="text-muted" th:text="${products.totalElements} + ' sản phẩm'"></span>
            </div>

            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col" th:each="product : ${products.content}">
                    <div class="card h-100 shadow-sm">
                        <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}" th:src="${product.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Product image">
                        <div th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}" class="bg-secondary text-white text-center py-5">Chưa có ảnh</div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-truncate" th:text="${product.name}">Tên</h5>
                            <p class="card-text text-danger fw-bold fs-5 mb-1" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</p>
                            <p class="card-text text-muted small mb-3" th:text="'Còn: ' + ${product.stock} + ' sản phẩm'"></p>
                            <div class="mt-auto">
                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary btn-sm w-100">Xem chi tiết</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${products.totalElements == 0}" class="alert alert-info mt-4 text-center">
                Không tìm thấy sản phẩm nào.
            </div>

            <!-- Phân trang -->
            <nav th:if="${products.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${products.number - 1}, keyword=${keyword})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${products.number + 1}, keyword=${keyword})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
