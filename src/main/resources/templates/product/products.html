<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sản phẩm - E-Commerce</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- Main -->
<main class="container py-5">

    <!-- Page header -->
    <div class="mb-4">

        <h1 class="fw-bold mb-2">
            Sản phẩm
        </h1>

        <p class="text-muted mb-0">
            Khám phá các sản phẩm đang được bán
            trên hệ thống.
        </p>

    </div>


    <div class="row g-4">

        <!-- ========================= -->
        <!-- FILTER SIDEBAR -->
        <!-- ========================= -->

        <aside class="col-lg-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h5 class="fw-bold mb-4">
                        Bộ lọc
                    </h5>


                    <!-- Search -->
                    <form th:action="@{/products}"
                          method="get">

                        <div class="mb-4">

                            <label for="keyword"
                                   class="form-label fw-semibold">

                                Tìm kiếm

                            </label>

                            <input type="text"
                                   id="keyword"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Tên sản phẩm..."
                                   th:value="${keyword}">

                        </div>


                        <!-- Category -->
                        <div class="mb-4">

                            <label for="categoryId"
                                   class="form-label fw-semibold">

                                Danh mục

                            </label>

                            <select id="categoryId"
                                    name="categoryId"
                                    class="form-select">

                                <option value="">
                                    Tất cả danh mục
                                </option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${categoryId != null
                                            and category.id == categoryId}">

                                    Category

                                </option>

                            </select>

                        </div>


                        <!-- Price -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Khoảng giá
                            </label>

                            <div class="row g-2">

                                <div class="col-6">

                                    <input type="number"
                                           name="minPrice"
                                           class="form-control"
                                           placeholder="Từ"
                                           min="0"
                                           step="1000"
                                           th:value="${minPrice}">

                                </div>

                                <div class="col-6">

                                    <input type="number"
                                           name="maxPrice"
                                           class="form-control"
                                           placeholder="Đến"
                                           min="0"
                                           step="1000"
                                           th:value="${maxPrice}">

                                </div>

                            </div>

                            <small class="text-muted">
                                Đơn vị: VNĐ
                            </small>

                        </div>


                        <!-- Filter button -->
                        <button type="submit"
                                class="btn btn-primary w-100">

                            Lọc sản phẩm

                        </button>

                    </form>


                    <!-- Clear filter -->
                    <div class="mt-2">

                        <a th:href="@{/products}"
                           class="btn btn-outline-secondary w-100">

                            Xóa bộ lọc

                        </a>

                    </div>

                </div>

            </div>

        </aside>


        <!-- ========================= -->
        <!-- PRODUCT CONTENT -->
        <!-- ========================= -->

        <section class="col-lg-9">

            <!-- Result information -->
            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>

                    <span class="text-muted">
                        Tìm thấy
                    </span>

                    <strong th:text="${page.totalElements}">
                        0
                    </strong>

                    <span class="text-muted">
                        sản phẩm
                    </span>

                </div>

                <div th:if="${page.totalPages > 0}"
                     class="text-muted small">

                    Trang
                    <strong th:text="${page.number + 1}">
                        1
                    </strong>
                    /
                    <strong th:text="${page.totalPages}">
                        1
                    </strong>

                </div>

            </div>


            <!-- Product grid -->
            <div class="row g-4"
                 th:if="${!page.empty}">

                <div class="col-6 col-md-4"
                     th:each="product : ${page.content}">

                    <div th:replace="~{fragments/product-card
                                      :: product-card(${product})}">
                    </div>

                </div>

            </div>


            <!-- No products -->
            <div th:if="${page.empty}"
                 class="text-center py-5">

                <div class="display-4 mb-3">
                    🔍
                </div>

                <h4 class="fw-bold">
                    Không tìm thấy sản phẩm
                </h4>

                <p class="text-muted">
                    Không có sản phẩm nào phù hợp
                    với điều kiện tìm kiếm.
                </p>

                <a th:href="@{/products}"
                   class="btn btn-outline-primary">

                    Xem tất cả sản phẩm

                </a>

            </div>


            <!-- Pagination -->
            <div class="mt-5"
                 th:if="${!page.empty}">

                <div th:replace="~{fragments/pagination
                  :: pagination(
                      ${page},
                      ${keyword},
                      ${categoryId},
                      ${minPrice},
                      ${maxPrice}
                  )}">
                </div>


            </div>

        </section>

    </div>

</main>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
