<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Chọn phương thức thanh toán')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<main class="container my-5" th:if="${order != null and payment != null}">
    <div class="mx-auto" style="max-width: 640px">
        <h2 class="mb-2">Chọn phương thức thanh toán</h2>
        <p class="text-muted">Đơn hàng #<span th:text="${order.id}"></span></p>

        <div class="alert alert-light border d-flex justify-content-between">
            <span>Tổng thanh toán</span>
            <strong th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong>
        </div>

        <form th:action="@{/orders/{id}/payment-method(id=${order.id})}" method="post">
            <fieldset class="mb-4">
                <legend class="fs-6 fw-semibold">Phương thức</legend>
                <div class="form-check border rounded p-3 ps-5 mb-2">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="payment-cod"
                           value="COD" th:checked="${payment.method.name() == 'COD'}">
                    <label class="form-check-label" for="payment-cod">
                        <strong>Thanh toán khi nhận hàng (COD)</strong>
                    </label>
                </div>
                <div class="form-check border rounded p-3 ps-5">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="payment-vnpay"
                           value="VNPAY" th:checked="${payment.method.name() == 'VNPAY'}">
                    <label class="form-check-label" for="payment-vnpay">
                        <strong>VNPay</strong>
                    </label>
                </div>
            </fieldset>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Tiếp tục thanh toán</button>
                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-secondary">Quay lại đơn hàng</a>
            </div>
        </form>
    </div>
</main>

<div class="container my-5" th:unless="${order != null and payment != null}">
    <div class="alert alert-warning">Không tìm thấy thông tin đơn hàng hoặc thanh toán.</div>
    <a th:href="@{/orders}" class="btn btn-primary">Danh sách đơn hàng</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
