<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm"
     style="background-color: #0056b3;">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold text-white"
           th:href="@{/}">
            🛒 E-Commerce
        </a>

        <!-- Mobile button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <!-- ========================= -->
            <!-- MENU CHÍNH -->
            <!-- ========================= -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Trang chủ -->
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/}">
                        Trang chủ
                    </a>
                </li>

                <!-- Sản phẩm -->
                <li class="nav-item">
                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/products}">
                        Sản phẩm
                    </a>
                </li>

                <!-- ========================= -->
                <!-- CHỈ USER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="hasRole('USER')">

                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/cart}">
                        🛒 Giỏ hàng
                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('USER')">

                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/orders}">
                        📦 Đơn mua
                    </a>

                </li>

                <!-- ========================= -->
                <!-- USER + MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link text-white fw-semibold position-relative"
                       th:href="@{/notifications}">

                        🔔 Thông báo

                        <span th:if="${unreadCount != null and unreadCount > 0}"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${unreadCount}">
                            0
                        </span>

                    </a>

                </li>

                <!-- ========================= -->
                <!-- CHỈ MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="hasRole('MANAGER')">

                    <a class="nav-link fw-bold"
                       style="color: #ffd600;"
                       th:href="@{/manager/dashboard}">

                        ⚙ Quản trị

                    </a>

                </li>

            </ul>


            <!-- ========================= -->
            <!-- SEARCH -->
            <!-- ========================= -->

            <form class="d-flex me-3"
                  th:action="@{/products/search}"
                  method="get">

                <input class="form-control me-2 form-control-sm"
                       type="search"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Tìm sản phẩm..."
                       style="min-width: 220px;">

                <button class="btn btn-light btn-sm fw-semibold"
                        type="submit">

                    🔍 Tìm

                </button>

            </form>


            <!-- ========================= -->
            <!-- ACCOUNT -->
            <!-- ========================= -->

            <ul class="navbar-nav mb-2 mb-lg-0">

                <!-- USER + MANAGER -->
                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/profile}">

                        👤 Tài khoản

                    </a>

                </li>

                <!-- GUEST -->
                <li class="nav-item"
                    sec:authorize="isAnonymous()">

                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/auth/login}">

                        Đăng nhập

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="isAnonymous()">

                    <a class="nav-link text-white fw-semibold"
                       th:href="@{/auth/register}">

                        Đăng ký

                    </a>

                </li>

                <!-- USER + MANAGER -->
                <li class="nav-item d-flex align-items-center"
                    sec:authorize="isAuthenticated()">

                    <form th:action="@{/auth/logout}"
                          method="post"
                          class="m-0">

                        <button type="submit"
                                class="nav-link text-white fw-semibold border-0 bg-transparent">
                            Đăng xuất

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
