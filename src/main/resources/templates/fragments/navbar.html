<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" th:href="@{/}">
            🛒 E-Commerce
        </a>

        <!-- Mobile button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <!-- ========================= -->
            <!-- MENU CHÍNH -->
            <!-- ========================= -->

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Guest + User + Manager -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">
                        Trang chủ
                    </a>
                </li>

                <!-- Guest + User + Manager -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">
                        Sản phẩm
                    </a>
                </li>


                <!-- ========================= -->
                <!-- CHỈ USER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="hasRole('USER')">

                    <a class="nav-link" th:href="@{/cart}">
                        Giỏ hàng
                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('USER')">

                    <a class="nav-link" th:href="@{/orders}">
                        Đơn mua
                    </a>

                </li>


                <!-- ========================= -->
                <!-- USER + MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link" th:href="@{/notifications}">
                        Thông báo
                    </a>

                </li>


                <!-- ========================= -->
                <!-- CHỈ MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="hasRole('MANAGER')">

                    <a class="nav-link text-warning"
                       th:href="@{/manager/dashboard}">

                        Quản trị

                    </a>

                </li>

            </ul>


            <!-- ========================= -->
            <!-- SEARCH -->
            <!-- Guest + User + Manager -->
            <!-- ========================= -->

            <form class="d-flex me-3"
                  th:action="@{/products/search}"
                  method="get">

                <input class="form-control me-2 form-control-sm"
                       type="search"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Tìm sản phẩm...">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">

                    Tìm

                </button>

            </form>


            <!-- ========================= -->
            <!-- ACCOUNT -->
            <!-- ========================= -->

            <ul class="navbar-nav mb-2 mb-lg-0">


                <!-- ========================= -->
                <!-- USER + MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <a class="nav-link"
                       th:href="@{/profile}">

                        Tài khoản

                    </a>

                </li>


                <!-- ========================= -->
                <!-- GUEST -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="isAnonymous()">

                    <a class="nav-link"
                       th:href="@{/auth/login}">

                        Đăng nhập

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="isAnonymous()">

                    <a class="nav-link"
                       th:href="@{/auth/register}">

                        Đăng ký

                    </a>

                </li>


                <!-- ========================= -->
                <!-- USER + MANAGER -->
                <!-- ========================= -->

                <li class="nav-item"
                    sec:authorize="isAuthenticated()">

                    <form th:action="@{/auth/logout}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-link nav-link p-0 d-inline">

                            Đăng xuất

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
