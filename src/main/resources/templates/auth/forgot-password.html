<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quên mật khẩu')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-3">Quên mật khẩu</h3>
                    <p class="text-muted text-center small mb-4">Nhập email đã đăng ký của bạn để nhận mã OTP lấy lại mật khẩu.</p>

                    <form th:action="@{/auth/send-forgot-otp}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email tài khoản:</label>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="nhapemail@example.com">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Gửi mã xác thực OTP</button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <a th:href="@{/auth/login}" class="text-decoration-none">&laquo; Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
