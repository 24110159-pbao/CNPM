<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đặt lại mật khẩu')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-3">Đặt lại mật khẩu</h3>
                    <p class="text-muted text-center small mb-4">
                        Nhập mã xác nhận OTP đã gửi tới <strong th:text="${email}">email</strong> và mật khẩu mới.
                    </p>

                    <form th:action="@{/auth/reset-password}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3">
                            <label for="otp" class="form-label">Mã OTP (6 số):</label>
                            <input type="text" id="otp" name="otp" class="form-control text-center fs-4 fw-bold" maxlength="6" required placeholder="123456">
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới:</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" required placeholder="Nhập mật khẩu mới">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Cập nhật mật khẩu mới</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
