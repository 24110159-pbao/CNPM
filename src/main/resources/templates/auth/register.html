<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đăng ký - Bước 1')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/messages :: messages}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center fw-bold mb-3">Đăng ký tài khoản</h3>
                    <p class="text-muted text-center small mb-4">Bước 1: Nhập email để hệ thống gửi mã xác thực OTP.</p>

                    <form th:action="@{/auth/send-register-otp}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email của bạn:</label>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="nhapemail@example.com">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Nhận mã OTP qua Email</button>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <span class="text-muted">Đã có tài khoản?</span>
                        <a th:href="@{/auth/login}" class="fw-bold text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
